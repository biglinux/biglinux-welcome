- title: "Initial Settings"
  subtitle: "We provide comprehensive settings for you to select in an extremely simple way."
  icon: "video-display-symbolic"
  actions:
    - label: "BigLinux Settings"
      icon: "initialSettings/biglinux-settings.svg"
      type: "app"
      command: "sh -c 'cd /usr/share/biglinux/biglinux-settings/ && exec -a biglinux-settings python main.py'"

    - label: "Display Settings"
      icon: "initialSettings/desktop.svg"
      type: "app"
      command: "systemsettings kcm_kscreen"

    - label: "Session and Themes"
      icon: "initialSettings/big-theme-gui.svg"
      type: "app"
      command: "big-theme-gui"

    - label: "Choose Your Avatar"
      icon: "initialSettings/avatar-default.svg"
      type: "app"
      command: "kcmshell6 kcm_users"

    - label: "Language Packs"
      icon: "initialSettings/preferences-desktop-locale.svg"
      type: "app"
      # type: "script"
      command: "kcmshell6 kcm_regionandlang"
      # command: "scripts/example.sh"

    - label: "Accessibility"
      icon: "initialSettings/preferences-desktop-accessibility.svg"
      type: "app"
      command: "kcmshell6 kcm_access"

- title: "Choose your default browser"
  subtitle: "Set your default browser."
  icon: "internet-web-browser-symbolic"
  page_type: "browsers"
  actions:
    - label: "Brave"
      package: "brave-browser"
      variants:
        - { check: "/usr/bin/brave", desktop: "brave-browser.desktop" }
        - { check: "/var/lib/flatpak/app/com.brave.Browser", desktop: "com.brave.Browser.desktop" }

    - label: "Chromium"
      package: "chromium"
      variants:
        - { check: "/usr/bin/chromium", desktop: "chromium.desktop" }
        - { check: "/var/lib/flatpak/app/org.chromium.Chromium", desktop: "org.chromium.Chromium.desktop" }

    # Chrome, Opera and Edge are AUR-only: shown as unavailable
    - label: "Chrome"
      package: "google-chrome"
      variants:
        - { check: "/usr/bin/google-chrome-stable", desktop: "google-chrome.desktop" }
        - { check: "/var/lib/flatpak/app/com.google.Chrome", desktop: "com.google.Chrome.desktop" }

    - label: "Falkon"
      package: "falkon"
      variants:
        - { check: "/usr/bin/falkon", desktop: "org.kde.falkon.desktop" }
        - { check: "/var/lib/flatpak/app/org.kde.falkon", desktop: "org.kde.falkon.desktop" }

    - label: "Firefox"
      package: "firefox"
      variants:
        - { check: "/usr/bin/firefox", desktop: "firefox.desktop" }
        - { check: "/var/lib/flatpak/app/org.mozilla.firefox", desktop: "org.mozilla.firefox.desktop" }

    - label: "Librewolf"
      package: "librewolf"
      variants:
        - { check: "/usr/bin/librewolf", desktop: "librewolf.desktop" }
        - { check: "/var/lib/flatpak/app/io.gitlab.librewolf-community", desktop: "io.gitlab.librewolf-community.desktop" }

    - label: "Opera"
      package: "opera"
      variants:
        - { check: "/usr/bin/opera", desktop: "opera.desktop" }
        - { check: "/var/lib/flatpak/app/com.opera.Opera", desktop: "com.opera.Opera.desktop" }

    - label: "Vivaldi"
      package: "vivaldi"
      variants:
        - { check: "/usr/bin/vivaldi", desktop: "vivaldi-stable.desktop" }
        - { check: "/var/lib/flatpak/app/com.vivaldi.Vivaldi", desktop: "com.vivaldi.Vivaldi.desktop" }

    - label: "Edge"
      package: "microsoft-edge-stable-bin"
      icon: "edge"
      variants:
        - { check: "/usr/bin/microsoft-edge-stable", desktop: "microsoft-edge.desktop" }
        - { check: "/var/lib/flatpak/app/com.microsoft.Edge", desktop: "com.microsoft.Edge.desktop" }

    - label: "Zen Browser"
      package: "zen-browser-bin"
      icon: "zen-browser"
      variants:
        - { check: "/usr/bin/zen-browser", desktop: "zen.desktop" }
        - { check: "/var/lib/flatpak/app/app.zen_browser.zen", desktop: "app.zen_browser.zen.desktop" }

- title: "KDE Connect"
  subtitle: "KDE Connect is an application that facilitates wireless communication and data transfer between devices on local networks. Available on the Google Play Store for Android and the Apple Store for iPhone."
  icon: "kdeconnect"
  actions:
    - label: "PlayStore"
      icon: "kdeConnect/kde-connect-playstore-qrcode.svg"
      type: "url"
      command: "https://play.google.com/store/apps/details?id=org.kde.kdeconnect_tp&pcampaignid=web_share"

    - label: "KDE Connect"
      icon: "kdeConnect/kdeconnect.svg"
      type: "app"
      command: "kdeconnect-app"

    - label: "AppStore"
      icon: "kdeConnect/kde-connect-appstore-qrcode.svg"
      type: "url"
      command: "https://apps.apple.com/br/app/kde-connect/id1580245991"

- title: "Driver Installation and Hardware Information"
  subtitle: "Manage drivers, firmware, and kernels, and check information about your hardware."
  icon: "cpu-symbolic"
  actions:
    # Unified drivers + kernels manager (replaces Driver Manager and Kernel Manager)
    - label: "Hardware Management"
      icon: "driverAndHardware/big-driver-manager.svg"
      type: "app"
      command: "big-driver-manager"
      package: "biglinux-driver-manager"

    - label: "BigLinux Info"
      icon: "driverAndHardware/big-hardware-info.svg"
      type: "app"
      command: "big-hardware-info"

    - label: "Network Info"
      icon: "driverAndHardware/big-network-info.svg"
      type: "app"
      command: "big-network-info"

    - label: "Printers"
      icon: "driverAndHardware/printer.svg"
      type: "app"
      command: "system-config-printer"

- title: "Family Safety"
  subtitle: "Protect your children online. Set up supervised accounts, screen time, and content filters."
  icon: "system-users-symbolic"
  actions:
    - label: "Open Parental Controls"
      icon: "parental/big-parental-controls.svg"
      type: "app"
      command: "big-parental-controls"

- title: "Discover some features"
  subtitle: "Our platform is collaborative, join this evolution."
  icon: "applications-utilities-symbolic"
  actions:
    - label: "Control Center"
      icon: "discover/bigcontrolcenter.svg"
      type: "app"
      command: "bigcontrolcenter"

    - label: "Big Store"
      icon: "discover/big-store.svg"
      type: "app"
      command: "big-store"

    - label: "WebApps"
      icon: "discover/big-webapps.svg"
      type: "app"
      command: "big-webapps-gui"

    - label: "Noise Reduction"
      icon: "discover/biglinux-noise-reduction-pipewire.svg"
      type: "app"
      command: "biglinux-microphone"
      package: "biglinux-noise-reduction-pipewire"

    - label: "Text Narrator"
      icon: "discover/biglinux-tts.svg"
      type: "app"
      command: "biglinux-tts"
      package: "tts-biglinux"

    - label: "OCR to PDF"
      icon: "discover/bigocrpdf.svg"
      type: "app"
      command: "bigocrpdf"

    - label: "Video Converter"
      icon: "discover/big-video-converter.svg"
      type: "app"
      command: "big-video-converter-gui"

    - label: "Audio Converter"
      icon: "discover/big-audio-converter.svg"
      type: "app"
      command: "big-audio-converter-gui"

    - label: "Ashy Terminal"
      icon: "discover/ashyterm.svg"
      type: "app"
      command: "ashyterm"

    - label: "Time Shift"
      icon: "discover/timeshift.svg"
      type: "app"
      command: "timeshift-launcher"

# Installable applications: "package" must be in the allowlist of
# install_backend.py and scripts/package-install.sh
- title: "Applications to Install"
  subtitle: "Discover and install powerful applications created for BigLinux. Enhance gaming, remote access, multimedia, productivity, and accessibility with just one click."
  icon: "system-software-install-symbolic"
  page_type: "apps"
  actions:
    - label: "Big Game Mode"
      description: "Optimize your games with performance profiles, graphics features, monitoring, and advanced settings."
      icon: "applications/bigame-mode.svg"
      package: "bigame-mode"
      command: "bigame-ui"

    - label: "Big Remote Play"
      description: "Share and play games remotely with other devices and friends."
      icon: "applications/big-remote-play.svg"
      package: "big-remote-play"
      command: "big-remote-play"

    - label: "BigCam"
      description: "Manage webcams, video sources, and multimedia features in one central interface."
      icon: "applications/bigcam.svg"
      package: "bigcam"
      command: "bigcam"

    - label: "ChatAI"
      description: "Access different artificial intelligence services directly from KDE Plasma."
      icon: "applications/chatai.svg"
      # Plasma widget, not a package (see install_backend.PLASMOID_SOURCES)
      plasmoid: "ChatAI-Plasmoid"

    - label: "BigLinux Body Tracker"
      description: "Use movements captured by your webcam to control your computer."
      icon: "applications/biglinux-body-tracker.svg"
      package: "biglinux-body-tracker"
      # Never from biglinux-testing, even when it is enabled first
      repository: "biglinux-stable"
      command: "big-head-tracker"

    - label: "Big Advogados"
      description: "Legal toolkit for Brazilian lawyers: digital certificates (A1/A3), PDF signing, WebSigner, and access to court systems."
      icon: "applications/big-advogados.svg"
      package: "big-advogados"
      repository: "biglinux-stable"
      command: "big-advogados"

